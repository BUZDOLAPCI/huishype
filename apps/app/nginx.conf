server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Hashed Expo assets — cache immutably
    location ^~ /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never serve route HTML for missing assets.
    location ~* \.(css|gif|html|ico|jpe?g|js|json|map|mjs|png|svg|txt|webp|woff2?)$ {
        try_files $uri =404;
    }

    # Expo static export emits HTML templates for dynamic routes. Serve those
    # templates on direct route loads so the initial HTML matches client state.
    location = /map {
        try_files $uri $uri.html /map/index.html /index.html;
    }

    location = /map/ {
        try_files $uri $uri.html /map/index.html /index.html;
    }

    location ~ ^/map/.+/?$ {
        try_files $uri $uri.html $uri/ /map/[...address].html /index.html;
    }

    location ~ ^/user/[^/]+/?$ {
        try_files $uri $uri.html $uri/ /user/[id].html /index.html;
    }

    location ~ ^/@[^/]+/?$ {
        try_files $uri $uri.html $uri/ /@[camera].html /index.html;
    }

    # Generic address catch-all. Real files and exported static route HTML win.
    location / {
        try_files $uri $uri.html $uri/ /[...address].html /index.html;
    }
}
