appId: nl.huishype.app
---
# 03-search-navigate.yaml — Search for Fixture Property
# Uses the search bar to navigate to a deterministic fixture property
# (Beeldbuisring 41, Eindhoven) seeded by the test fixture script.
# This is a sub-flow; app is on the Map tab.
#
# NOTE: The GroupPreviewCard is rendered inside a MapLibre <Marker>
# component, which on Android v11 alpha renders children as real native
# Views (via MarkerViewNativeComponent / Fabric). They ARE visible to
# Maestro/uiautomator. This flow tests search + property resolution +
# bottom sheet peek.

# Normalize back to the plain map/search surface. Earlier flows can leave us on
# the shared property-detail route or a preview state.
- tapOn:
    text: 'Go back'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'property-back-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'tab-index'
    optional: true
- waitForAnimationToEnd

# The map shell can still be painting tiles after feed -> map navigation.
# The search bar is rendered underneath that transient loading overlay, so wait
# for the overlay to clear before asserting the search entry surface.
- extendedWaitUntil:
    notVisible:
      id: 'map-loading-indicator'
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 15000

# Focus the search bar using whichever control is currently rendered.
- tapOn:
    id: 'search-bar-focus-target'
- waitForAnimationToEnd

- tapOn:
    id: 'search-bar-input'
- waitForAnimationToEnd

# Type the fixture address
- inputText: 'Beeldbuisring 41 Eindhoven'

# Wait for search results to appear (network call + debounce)
- extendedWaitUntil:
    visible:
      id: 'search-result-item'
    timeout: 15000

- takeScreenshot: test-results/visual-overhaul/search-results/android/search-results.png

# Tap the matching search result
- tapOn:
    id: 'search-result-item'
- waitForAnimationToEnd

# Wait for camera fly-to animation to complete
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# After search result tap, the property is resolved and:
# 1. Camera flies to the property (zoom 17)
# 2. GroupPreviewCard appears as a native overlay
# 3. PropertyBottomSheet peeks at 10% with property data
#
- takeScreenshot: test-results/visual-overhaul/map-screen/android/search-property-selected.png

# Verify the resolved property preview card appeared
- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 10000

- takeScreenshot: test-results/visual-overhaul/map-screen/android/search-map-at-property.png
