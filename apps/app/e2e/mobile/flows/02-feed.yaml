appId: nl.huishype.app
---
# 02-feed.yaml — Feed Tab
# Tests feed filters, property cards, scrolling, and card tap navigation.
# This is a sub-flow; app is on the Map tab.

# Navigate to Feed tab. The feed screen can render correctly while Maestro's
# Android hierarchy dump intermittently exposes only system UI, so this visual
# mobile flow uses stable tab coordinates after the smoke flow has verified tab
# testIDs.
- tapOn:
    point: '15%,92%'
- waitForAnimationToEnd
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'feed-screen'
    timeout: 15000

- assertVisible:
    id: 'filter-chip-trending'
- assertVisible:
    id: 'filter-chip-latest'

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-filter.png

- extendedWaitUntil:
    visible:
      id: 'feed-list'
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: 'property-feed-card'
    timeout: 30000

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-cards-loaded.png

- tapOn:
    id: 'property-feed-card'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 15000

- assertVisible:
    id: 'tab-index'
- assertVisible:
    id: 'tab-feed'

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-card-navigated-to-map.png
