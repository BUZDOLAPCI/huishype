appId: nl.huishype.app
---
# 02-feed.yaml — Feed Tab
# Tests feed filters, property cards, scrolling, and card tap navigation.
# This is a sub-flow; app is on the Map tab.

# Navigate to Feed tab
- tapOn:
    id: 'tab-feed'

# Wait for the feed screen to become active.
# The feed header title is a stronger activation signal than tab internals.
- extendedWaitUntil:
    visible: 'Trending Properties'
    timeout: 30000

# Assert the feed header and filter chips are visible
- assertVisible: 'Trending Properties'
- assertVisible: 'Trending'
- assertVisible: 'Latest'
- assertVisible: 'Recent Activity'

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-filter.png

# Verify property cards are displayed
# Feed API call may take time on device — wait for the first property card to load
- extendedWaitUntil:
    visible:
      id: 'property-feed-card'
    timeout: 30000

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-cards-loaded.png

# Scroll once to verify the list is interactive on device, then reset near the
# top before handing control back to the map flows.
- swipe:
    start: '50%,80%'
    end: '50%,35%'
    duration: 350
- waitForAnimationToEnd
- swipe:
    start: '50%,35%'
    end: '50%,80%'
    duration: 350
- waitForAnimationToEnd

# Switch back to Map tab
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 10000
