appId: nl.huishype.app
---
# 02-feed.yaml — Feed Tab
# Tests feed filters, property cards, scrolling, and card tap navigation.
# This is a sub-flow; app is on the Map tab.

# Navigate to Feed tab
- tapOn: 'Feed'

# Wait for feed to load - filter chips should be visible
# Default active filter is "Trending"
- extendedWaitUntil:
    visible: 'Trending'
    timeout: 30000

# Assert filter chips visible
- assertVisible: 'Trending'
- assertVisible: 'Latest'
- assertVisible: 'Recent Activity'

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-filter.png

# Verify property cards are displayed (guesses count is always present)
# Feed API call may take time on device — wait for cards to load
- extendedWaitUntil:
    visible: '.*guesses.*'
    timeout: 30000

# Tap "Latest" filter to test filter switching
- tapOn: 'Latest'
- waitForAnimationToEnd

# Verify cards still render after filter change
- assertVisible:
    text: '.*guesses.*'
    optional: true

- takeScreenshot: test-results/visual-overhaul/feed-latest/android/feed-latest-filter.png

# Switch back to "Trending" filter
- tapOn: 'Trending'
- waitForAnimationToEnd

# Scroll down to test pagination
- scroll
- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-scrolled-down.png

# Scroll back up
- swipe:
    direction: DOWN
    duration: 500
- swipe:
    direction: DOWN
    duration: 500
- swipe:
    direction: DOWN
    duration: 500
- waitForAnimationToEnd

# Tap on a property card to view details
- tapOn:
    point: '50%,40%'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/feed-trending/android/feed-trending-card-tap.png

# If property detail screen appeared, verify it has elements
- assertVisible:
    text: 'Save'
    optional: true
- assertVisible:
    text: 'Share'
    optional: true

# Navigate back (Android back button)
- pressKey: back
- waitForAnimationToEnd

# Wait for feed to be visible again
- extendedWaitUntil:
    visible: 'Trending'
    timeout: 10000

# Switch back to Map tab
- tapOn: 'Map'
- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 10000
