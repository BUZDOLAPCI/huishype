appId: nl.huishype.app
---
# 07-cleanup.yaml — Final State
# Dismisses any bottom sheet/overlay and verifies the app is in a clean state.
# This is a sub-flow; user is authenticated.

# Tap the Map tab to ensure we're on the map screen
# (Do NOT use pressKey: Back — it can exit the app entirely)
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd

# Swipe down to dismiss any bottom sheet
- swipe:
    start: '50%,30%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd

# Verify the portrait-native map shell is back in its baseline state
- extendedWaitUntil:
    visible:
      id: 'map-view'
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 10000

- assertVisible:
    id: 'map-filter-rail'
- assertVisible:
    id: 'location-button'

# Assert tab bar is accessible
- assertVisible:
    id: 'tab-index'
- assertVisible:
    id: 'tab-feed'

- takeScreenshot: test-results/visual-overhaul/map-screen/android/final-state.png
