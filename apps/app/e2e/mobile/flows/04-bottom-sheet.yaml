appId: nl.huishype.app
---
# 04-bottom-sheet.yaml — Bottom Sheet Browse + Auth Gates (unauthenticated)
# Tests the bottom sheet expansion, content sections, and auth gate modals.
# This is a sub-flow; property (Beeldbuisring 41) has been resolved via search.
#
# NOTE: The GroupPreviewCard is inside a MapLibre <Marker> which on
# Android v11 alpha renders real native Views (visible to Maestro).
# We expand the bottom sheet by swiping up from peek position (10% height).

# The native search flow lands in preview-card + sheet-peek state.
# The sheet peek is too small to expose the header carousel, so wait for the
# preview surface instead and only assert sheet content after expansion.
- extendedWaitUntil:
    visible: '.*Beeldbuisring.*'
    timeout: 15000

# Tap the preview card body to open the bottom sheet to its partial state.
- tapOn:
    id: 'property-preview-card'
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/property-detail/android/bottom-sheet-partial.png

# Wait for sheet content to become visible after the first expansion
- extendedWaitUntil:
    visible:
      id: 'property-header-carousel'
    timeout: 10000

- extendedWaitUntil:
    visible: '.*Beeldbuisring.*'
    timeout: 10000

# Swipe up further to fully expand the bottom sheet (90%)
- swipe:
    start: '50%,60%'
    end: '50%,15%'
    duration: 500
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/property-detail/android/bottom-sheet-full.png

# --- Verify bottom sheet structural sections ---
# QuickActions (Save, Share buttons in bottom sheet)
- assertVisible:
    text: 'Save'
    optional: true
- assertVisible:
    text: 'Share'
    optional: true

# --- Auth gate: Like button in bottom sheet QuickActions ---
- tapOn:
    text: 'Like'
    optional: true
- waitForAnimationToEnd

# Assert auth modal appears with "Sign In" header text (optional — Like may not have been tapped)
- extendedWaitUntil:
    visible: 'Sign In'
    timeout: 5000
    optional: true

- takeScreenshot: test-results/visual-overhaul/auth-modal/android/like-auth-gate.png

# Dismiss auth modal if it appeared
- tapOn:
    text: 'Close'
    optional: true
- waitForAnimationToEnd

# --- Scroll to PriceGuessSection ---
- swipe:
    start: '50%,60%'
    end: '50%,30%'
    duration: 300
- waitForAnimationToEnd

# Verify price guess section exists (either auth prompt or submit form)
- assertVisible:
    text: 'Guess the Price'
    optional: true

- takeScreenshot: test-results/visual-overhaul/price-guesses/android/price-section.png

# Continue scrolling to Comments section
- swipe:
    start: '50%,70%'
    end: '50%,30%'
    duration: 300
- waitForAnimationToEnd

# Verify "Comments" header visible (seeded fixture has 5 comments)
- assertVisible:
    text: 'Comments'
    optional: true

# Verify comment input area shows auth prompt for unauthenticated users
- assertVisible:
    text: '.*Log in to comment.*'
    optional: true

# Tap "Popular" sort toggle (optional — requires comments to have loaded)
- tapOn:
    text: 'Popular'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/comments/android/comments-section.png

# Scroll to see more of comments section
- swipe:
    start: '50%,70%'
    end: '50%,30%'
    duration: 300
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/property-detail/android/bottom-sheet-scrolled.png
