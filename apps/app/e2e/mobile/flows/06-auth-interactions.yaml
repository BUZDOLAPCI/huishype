appId: nl.huishype.app
---
# 06-auth-interactions.yaml — Post-Login Interactions
# After login, the property was deselected (handleAuthStarting clears it).
# Re-search for the fixture property to restore the preview card, then tap the
# card to open the bottom sheet before testing authenticated interactions.
#
# Search selection restores the preview card first; we tap that card to open
# the bottom sheet for authenticated interaction testing.

# Make sure we're on the Map tab
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd

# Clear any previous search text and re-search
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 15000

- tapOn:
    id: 'search-bar-focus-target'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-bar-input'
- waitForAnimationToEnd

- inputText: 'Beeldbuisring 41 Eindhoven'
- pressKey: Back
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'search-result-item'
    timeout: 15000

- tapOn:
    id: 'search-result-item'
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for the preview card to appear, then open the bottom sheet using the
# same unobscured stat-row card-body taps that proved reliable in flow 04.
- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 15000

- tapOn:
    id: 'property-preview-comment-count'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'property-preview-like-count'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'group-preview-touch-overlay'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'property-preview-card'
    optional: true
- waitForAnimationToEnd

# Partial open keeps the preview card mounted over the header region. Expand to
# full height before asserting the carousel that sits underneath it.
- swipe:
    start: '50%,20%'
    end: '50%,12%'
    duration: 500
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'property-header-carousel'
    timeout: 15000

- takeScreenshot: test-results/visual-overhaul/property-detail/android/auth-bottom-sheet.png

# All assertions below are optional — bottom sheet expansion may not work
- assertVisible:
    text: 'Save'
    optional: true
- assertVisible:
    text: 'Share'
    optional: true

# Jump to the price section through the preview quick action. On portrait native
# the post-login sheet re-opens in preview/peek state, and the app's scroll
# helper is more reliable than a raw drag gesture here.
- tapOn:
    id: 'group-preview-guess-button'
- waitForAnimationToEnd
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Guess the Price'
    timeout: 15000

- tapOn:
    id: 'submit-guess-button'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/price-guesses/android/auth-price-guess.png

# Continue via the comment quick action for the same reason: it uses the
# app-owned native scroll target instead of depending on screen coordinates.
- tapOn:
    id: 'group-preview-comment-button'
- waitForAnimationToEnd
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Comments'
    timeout: 15000

- assertVisible:
    text: '.*thoughts.*'
    optional: true

- takeScreenshot: test-results/visual-overhaul/comments/android/auth-comment-section.png

# Scroll back up
- swipe:
    start: '50%,30%'
    end: '50%,70%'
    duration: 300
- waitForAnimationToEnd
- swipe:
    start: '50%,30%'
    end: '50%,70%'
    duration: 300
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/property-detail/android/auth-final-state.png
