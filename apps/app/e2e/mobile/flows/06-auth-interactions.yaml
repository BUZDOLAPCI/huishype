appId: nl.huishype.app
---
# 06-auth-interactions.yaml — Post-Login Interactions
# After login, the property was deselected (handleAuthStarting clears it).
# Re-search for the fixture property to restore the preview card, then tap the
# card to open the bottom sheet before testing authenticated interactions.
#
# NOTE: GroupPreviewCard is in a MapLibre <Marker> (real native Views on
# Android v11 alpha, visible to Maestro). Search selection restores the
# preview card first; we tap that card to open the bottom sheet for
# authenticated interaction testing.

# Make sure we're on the Map tab
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd

# Clear any previous search text and re-search
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-bar-focus-target'
- waitForAnimationToEnd

- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-bar-input'
- waitForAnimationToEnd

- inputText: 'Beeldbuisring 41 Eindhoven'

- extendedWaitUntil:
    visible:
      id: 'search-result-item'
    timeout: 15000

- tapOn:
    id: 'search-result-item'
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for the preview card to appear, then tap it to open the bottom sheet.
- extendedWaitUntil:
    visible: '.*Beeldbuisring.*'
    timeout: 15000

- tapOn:
    id: 'property-preview-card'
- waitForAnimationToEnd

# Wait for property detail content to load after the sheet opens
- extendedWaitUntil:
    visible:
      id: 'property-header-carousel'
    timeout: 15000

# Expand bottom sheet
- swipe:
    start: '50%,88%'
    end: '50%,40%'
    duration: 500
- waitForAnimationToEnd

# Expand to full height
- swipe:
    start: '50%,60%'
    end: '50%,15%'
    duration: 500
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/property-detail/android/auth-bottom-sheet.png

# All assertions below are optional — bottom sheet expansion may not work
- assertVisible:
    text: 'Save'
    optional: true
- assertVisible:
    text: 'Share'
    optional: true

# Scroll to price guess section
- swipe:
    start: '50%,60%'
    end: '50%,30%'
    duration: 300
- waitForAnimationToEnd

- assertVisible:
    text: 'Guess the Price'
    optional: true

- tapOn:
    id: 'submit-guess-button'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/price-guesses/android/auth-price-guess.png

# Scroll to comments
- swipe:
    start: '50%,70%'
    end: '50%,30%'
    duration: 300
- waitForAnimationToEnd

- assertVisible:
    text: 'Comments'
    optional: true

- assertVisible:
    text: '.*thoughts.*'
    optional: true

- takeScreenshot: test-results/visual-overhaul/comments/android/auth-comment-section.png

# Scroll back up
- swipe:
    start: '50%,30%'
    end: '50%,70%'
    duration: 300
- waitForAnimationToEnd
- swipe:
    start: '50%,30%'
    end: '50%,70%'
    duration: 300
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/property-detail/android/auth-final-state.png
