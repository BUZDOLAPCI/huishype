appId: nl.huishype.app
---
# 05-login.yaml — Dev Login
# Uses the Profile unauthenticated state to trigger the auth modal, then Dev Login.
# This is a sub-flow; bottom sheet is fully expanded on the fixture property.
#
# KNOWN ISSUE: The bottom sheet can trigger a "NavigationStateContext" render
# error during complex state transitions. If the RN error overlay appears,
# we dismiss it.
#
# NOTE: Dev Login button is rendered outside the Reanimated Animated.View
# so that Android accessibility bounds are correct and Maestro can tap by text.

# Dismiss any React Native error overlay that may have appeared
- tapOn:
    text: 'Dismiss'
    optional: true
- waitForAnimationToEnd

# After flow 04, the bottom sheet may be fully expanded or in error state.
# Tap the Map tab to navigate away and reset state.
- tapOn:
    id: 'tab-index'
    optional: true
- waitForAnimationToEnd

# Dismiss bottom sheet by swiping down from handle area
- swipe:
    start: '50%,12%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd

# If there's still an error overlay, dismiss it
- tapOn:
    text: 'Dismiss'
    optional: true
- waitForAnimationToEnd

# Restart the app before the auth flow so Profile does not inherit the fully
# expanded property sheet and native map state from the previous sub-flow.
- stopApp
- launchApp
- waitForAnimationToEnd

- tapOn:
    text: 'Continue'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'welcome-modal-dismiss-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'welcome-modal-close'
    optional: true
- waitForAnimationToEnd
- pressKey: Back
- waitForAnimationToEnd

# Navigate to the Profile tab where the unauthenticated state owns the sign-in CTA
- tapOn:
    id: 'tab-profile'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'profile-sign-in-button'
    timeout: 15000

- tapOn:
    id: 'profile-sign-in-button'
- waitForAnimationToEnd

# Wait for modal slide-up animation to complete (300ms + buffer)
- waitForAnimationToEnd
- waitForAnimationToEnd

# Assert auth modal header is visible
- extendedWaitUntil:
    visible: 'Welcome to HuisHype'
    timeout: 15000

- takeScreenshot: test-results/visual-overhaul/auth-modal/android/auth-modal.png

# Dev Login button is rendered outside the Reanimated Animated.View
# so Android accessibility bounds are correct and Maestro can find it by label.
- tapOn:
    id: 'dev-login-button'
- waitForAnimationToEnd

# Wait for auth state transition to complete
- waitForAnimationToEnd
- waitForAnimationToEnd

# Dismiss any error overlay from auth state cascade
- tapOn:
    text: 'Dismiss'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'map-view'
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 15000

- assertVisible:
    id: 'map-filter-rail'
- assertVisible:
    id: 'location-button'

- takeScreenshot: test-results/visual-overhaul/map-screen/android/logged-in.png
- takeScreenshot: test-results/visual-overhaul/map-screen/android/post-login-map.png

# Verify auth succeeded: navigate to Profile and confirm sign-in button is gone
- tapOn:
    id: 'tab-profile'
- waitForAnimationToEnd

# The sign-in button should NOT be visible if login succeeded
- assertNotVisible:
    id: 'profile-sign-in-button'

# Return to Map tab for the next flow
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd
