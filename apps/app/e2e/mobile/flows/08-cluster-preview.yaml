appId: nl.huishype.app
---
# 08-cluster-preview.yaml — Cluster Preview Card Test
# Tests cluster visibility from a low-zoom camera route and cluster tap →
# GroupPreviewCard.
# This is a sub-flow; user is authenticated and on the Map tab after cleanup.
#
# Note: queryRenderedFeatures has a known C++ bug on MapLibre Android native
# (issues #2875, #2828). Cluster tap may only trigger intermittently, so
# GroupPreviewCard assertions use `optional: true` to avoid flaky failures.
# The test still captures screenshots to verify cluster rendering visually.

# Ensure we're on the Map tab
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd

# Wait for the portrait-native map shell to be ready
- extendedWaitUntil:
    visible:
      id: 'map-view'
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 10000

- assertVisible:
    id: 'map-filter-rail'
- assertVisible:
    id: 'location-button'

# Dismiss any existing preview/bottom sheet by tapping empty area then swiping down
- swipe:
    start: '50%,30%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd

# Native portrait intentionally hides zoom buttons, so jump to a canonical
# low-zoom camera route instead of assuming those controls are usable.
- openLink:
    link: 'huishype:///@51.4405702,5.4707418,13z'
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for tiles to load at the low-zoom camera route
- extendedWaitUntil:
    visible:
      id: 'map-view'
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 10000

- assertVisible:
    id: 'map-filter-pill-price'
- assertVisible:
    id: 'location-button'

- takeScreenshot: test-results/visual-overhaul/cluster-preview/android/clusters-zoom-level.png

# Tap on the center of the map to try to hit a cluster
# At zoom ~12-13, Eindhoven area should have clustered property nodes
- tapOn:
    point: '50%,50%'
- waitForAnimationToEnd

# Wait a moment for queryRenderedFeatures + potential batch API call
# GroupPreviewCard shows "X of Y" page indicator for clusters
- extendedWaitUntil:
    visible:
      id: 'group-preview-page-indicator'
    timeout: 8000
    optional: true

- takeScreenshot: test-results/visual-overhaul/cluster-preview/android/after-cluster-tap.png

# If cluster preview appeared, test the navigation controls
# All these assertions are optional due to the queryRenderedFeatures bug

# Check if "of" indicator is visible (e.g., "1 of 5")
- assertVisible:
    id: 'group-preview-card'
    optional: true

# Try navigating to the next property in the cluster
- tapOn:
    id: 'group-preview-nav-right'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/cluster-preview/android/cluster-navigated.png

# Try navigating back
- tapOn:
    id: 'group-preview-nav-left'
    optional: true
- waitForAnimationToEnd

# Close the cluster preview if it was shown
- tapOn:
    id: 'group-preview-close-button'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/cluster-preview/android/cluster-closed.png

# Try a second tap at a different position (slightly off-center)
# to increase chances of hitting a cluster node
- tapOn:
    point: '40%,45%'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Swipe to browse'
    timeout: 8000
    optional: true

- takeScreenshot: test-results/visual-overhaul/cluster-preview/android/second-cluster-attempt.png

# Clean up: restore the neutral map shell for the next flow.
# The preview close button can overlap the expanded search field on Android,
# so blur search first, then dismiss the preview from empty map space.
- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd

- tapOn:
    point: '12%,72%'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'group-preview-close-button'
    optional: true
- waitForAnimationToEnd

# If the close-button tap hit the search field instead of the preview overlay,
# blur it one more time before asserting the shell state.
- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 10000

# Final state: preview card dismissed and search unfocused before 09 starts.
- assertNotVisible:
    id: 'group-preview-card'

- assertVisible:
    id: 'location-button'
