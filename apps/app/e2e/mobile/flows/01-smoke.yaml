appId: nl.huishype.app
---
# 01-smoke.yaml — App Launch Verification
# Verifies the map loaded, tab bar is visible, and zoom controls work.
# This is a sub-flow; app is already launched by the orchestrator.

# Normalize to the map tab in case Expo restored a nested route after boot.
- tapOn:
    text: 'Go back'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'property-back-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: '50%,50%'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'tab-index'
    optional: true
- waitForAnimationToEnd

# Verify the tab bar is visible
- assertVisible: 'Map'
- assertVisible: 'Feed'

# Verify the map loaded
- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 20000

- takeScreenshot: test-results/visual-overhaul/map-screen/android/map-screen-app-launched.png

# Test zoom-in control
- tapOn:
    id: 'zoom-in-button'
- waitForAnimationToEnd

# Verify controls still exist after zoom in
- assertVisible:
    id: 'zoom-out-button'

# Test zoom-out control (uses Unicode MINUS SIGN, target by testID)
- tapOn:
    id: 'zoom-out-button'
- waitForAnimationToEnd

# Verify the location button remains visible after zoom out
- assertVisible:
    id: 'location-button'

- takeScreenshot: test-results/visual-overhaul/map-screen/android/map-screen-zoom-controls-verified.png
