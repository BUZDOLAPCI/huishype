appId: nl.huishype.app
---
# 01-smoke.yaml — App Launch Verification
# Verifies the portrait-native map shell loaded and stable readiness
# sentinels are visible.
# This is a sub-flow; app is already launched by the orchestrator.

# Expo dev-client can surface the developer-menu intro sheet after the app
# becomes interactive. Dismiss it before normalizing the map surface.
- tapOn:
    text: 'Continue'
    optional: true
- waitForAnimationToEnd

# Normalize to the map tab in case Expo restored a nested route after boot.
- tapOn:
    text: 'Go back'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'property-back-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: '50%,50%'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'tab-index'
    optional: true
- waitForAnimationToEnd

# Verify the tab bar is visible
- assertVisible:
    id: 'tab-index'
- assertVisible:
    id: 'tab-feed'

# Verify the map loaded
- extendedWaitUntil:
    visible:
      id: 'map-view'
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 20000

- assertVisible:
    id: 'map-filter-rail'
- assertVisible:
    id: 'map-filter-pill-price'
- assertVisible:
    id: 'location-button'

- takeScreenshot: test-results/visual-overhaul/map-screen/android/map-screen-app-launched.png

# Verify the shared portrait-native chrome stays available after boot.
- assertVisible:
    id: 'tab-index'
- assertVisible:
    id: 'tab-feed'
- assertVisible:
    id: 'search-bar-container'
- assertVisible:
    id: 'location-button'

- takeScreenshot: test-results/visual-overhaul/map-screen/android/map-screen-readiness-verified.png
