appId: nl.huishype.app
---
# 09-preview-card-interactions.yaml — Preview Card Touch Interactions
# Tests that preview card overlays on the map handle touch events correctly:
#   1. Card body tap opens property details (bottom sheet)
#   2. Quick action buttons respond without dismissing the card
#   3. Close button dismisses the card
#   4. Cluster swipe pagination
#
# This is a sub-flow; user is authenticated and on the Map tab after
# cluster-preview flow. The map is at a zoomed-out level (~12-13).
#
# COORDINATE-BASED INTERACTIONS:
# MapLibre Marker children (GroupPreviewCard) are rendered as real native
# Android Views via MarkerViewNativeComponent (Fabric), but they sit inside
# MapLibre's native view hierarchy which does NOT expose children to
# uiautomator/Maestro. The testIDs (group-preview-card, group-preview-like-button,
# group-preview-close-button, etc.) are invisible to the accessibility tree.
#
# Therefore this flow uses coordinate-based tapping (tapOn: point: "X%,Y%")
# for all preview card interactions. Coordinates are calibrated for the card
# position after searching "Beeldbuisring 41 Eindhoven" at zoom 17:
#   - Card body:   ~75%, 50%  (center-right of screen)
#   - Like button:  ~58%, 62%
#   - Close button: ~98%, 41%
#
# Text content rendered inside the card (address, price) MAY be visible to
# the accessibility tree even when testIDs are not, so we use text-based
# assertions where possible.

# =====================================================================
# SETUP: Navigate to the fixture property to get a single preview card
# =====================================================================

# Ensure we're on the Map tab
- tapOn: 'Map'
- waitForAnimationToEnd

# Dismiss any existing preview card or bottom sheet by tapping empty map area
- tapOn:
    point: '20%,40%'
    optional: true
- waitForAnimationToEnd

# Swipe down to dismiss any bottom sheet that might be open
- swipe:
    start: '50%,30%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd

# Clear any previous search text
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

# Search for the fixture property
- tapOn:
    id: 'search-bar-input'
- waitForAnimationToEnd

- inputText: 'Beeldbuisring 41 Eindhoven'

# Wait for PDOK search results to appear
- extendedWaitUntil:
    visible: '.*Beeldbuisring 41.*'
    timeout: 15000

# Tap the matching search result — this triggers camera fly-to + preview card
- tapOn:
    id: 'search-result-item'
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for the map to settle at zoom 17
- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 15000

# =====================================================================
# TEST 1: Preview card appears after search navigation
# =====================================================================

# Give the preview card time to render after camera animation
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/preview-card-visible.png

# Verify the card shows the fixture property address (text may be accessible
# even though testIDs inside MapLibre Marker are not)
- assertVisible:
    text: '.*Beeldbuisring.*'
    optional: true

# =====================================================================
# TEST 2: Card body tap opens property details (bottom sheet)
# =====================================================================

# Tap on the card body area (center-right of screen where card renders)
# This should open the PropertyBottomSheet
- tapOn:
    point: '75%,50%'
    optional: true
- waitForAnimationToEnd

# Wait for the bottom sheet to appear with property content
- extendedWaitUntil:
    visible:
      id: 'property-header-carousel'
    timeout: 10000
    optional: true

- takeScreenshot: test-results/visual-overhaul/preview-card/android/card-tap-bottom-sheet.png

# Verify bottom sheet shows the property address
- assertVisible:
    text: '.*Beeldbuisring.*'
    optional: true

# =====================================================================
# TEST 3: Dismiss bottom sheet to get back to preview card
# =====================================================================

# Dismiss the bottom sheet by tapping on empty map area (top-left)
# Note: swiping down does NOT reliably dismiss @gorhom/bottom-sheet via Maestro
- tapOn:
    point: '20%,40%'
- waitForAnimationToEnd
- waitForAnimationToEnd

# The preview card may or may not still be visible after dismissing the bottom sheet
- takeScreenshot: test-results/visual-overhaul/preview-card/android/after-dismiss-bottom-sheet.png

# Check if card address text is still visible (optional — card may have been dismissed)
- assertVisible:
    text: '.*Beeldbuisring.*'
    optional: true

# =====================================================================
# TEST 4: Quick action button (Like) — card stays visible
# =====================================================================

# If the preview card was dismissed when bottom sheet closed, re-trigger it
# by searching again
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: 'search-bar-input'
    optional: true
- waitForAnimationToEnd
- inputText: 'Beeldbuisring 41 Eindhoven'
- extendedWaitUntil:
    visible: '.*Beeldbuisring 41.*'
    timeout: 15000
- tapOn:
    id: 'search-result-item'
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 15000
- waitForAnimationToEnd

# Tap the Like button area on the preview card
# This should trigger the like action (or auth modal) but NOT dismiss the card
- tapOn:
    point: '58%,62%'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/after-like-tap.png

# Dismiss auth modal if it appeared (the "Close" text button IS accessible to Maestro)
- tapOn:
    text: 'Close'
    optional: true
- waitForAnimationToEnd

# =====================================================================
# TEST 5: Close button dismisses the card
# =====================================================================

# Tap the close button (X) in the top-right corner of the preview card
- tapOn:
    point: '98%,41%'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/card-closed.png

# =====================================================================
# TEST 6: Cluster swipe pagination (zoom out to create clusters)
# =====================================================================
# Note: Clusters are unreliable due to queryRenderedFeatures bug on Android
# native (MapLibre issues #2875, #2828). All steps are optional.

# Zoom out several times to reach cluster-visible level (~zoom 13)
- tapOn:
    id: 'zoom-out-button'
- waitForAnimationToEnd
- tapOn:
    id: 'zoom-out-button'
- waitForAnimationToEnd
- tapOn:
    id: 'zoom-out-button'
- waitForAnimationToEnd
- tapOn:
    id: 'zoom-out-button'
- waitForAnimationToEnd
- tapOn:
    id: 'zoom-out-button'
- waitForAnimationToEnd

# Wait for tiles to reload at new zoom
- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 10000

# Tap center of the map to try to hit a cluster node
- tapOn:
    point: '50%,50%'
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/cluster-for-swipe.png

# If cluster preview appeared, test swipe pagination
# Swipe left on the card to go to next property (should NOT pan the map)
- swipe:
    start: '70%,50%'
    end: '30%,50%'
    duration: 300
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/cluster-swiped.png

# Try tapping approximate position of right navigation arrow (optional)
- tapOn:
    point: '90%,50%'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/cluster-nav-arrow.png

# =====================================================================
# CLEANUP: Close any remaining preview and return to clean state
# =====================================================================

# Tap the close button area to dismiss any preview card
- tapOn:
    point: '98%,41%'
    optional: true
- waitForAnimationToEnd

# Tap empty map area to dismiss anything else
- tapOn:
    point: '20%,40%'
    optional: true
- waitForAnimationToEnd

# Verify map is visible
- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 10000
