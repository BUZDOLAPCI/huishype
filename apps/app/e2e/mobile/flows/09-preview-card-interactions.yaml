appId: nl.huishype.app
---
# 09-preview-card-interactions.yaml — Preview Card Touch Interactions
# Tests that preview card overlays on the map handle touch events correctly:
#   1. Card body tap opens property details (bottom sheet)
#   2. Quick action buttons respond without dismissing the card
#   3. Close button dismisses the card
#   4. Cluster swipe pagination
#
# This is a sub-flow; user is authenticated and on the Map tab after
# cluster-preview flow.
#
# Preview interactions now use surfaced native testIDs. This flow intentionally
# exercises the actual preview buttons instead of coordinate-based taps.

# =====================================================================
# SETUP: Navigate to the fixture property to get a single preview card
# =====================================================================

# Ensure we're on the Map tab
- tapOn:
    id: 'tab-index'
- waitForAnimationToEnd

# Normalize the 08 -> 09 handoff.
# 08 can leave the preview anchored under the search bar, where tapping the
# close button may focus search instead of clearing the shell state.
- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd

# Dismiss any existing preview card from safe empty map space
- tapOn:
    point: '12%,72%'
    optional: true
- waitForAnimationToEnd

# Swipe down to dismiss any bottom sheet that might be open
- swipe:
    start: '50%,30%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd

- tapOn:
    id: 'group-preview-close-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-overlay-backdrop'
    optional: true
- waitForAnimationToEnd

# Clear any previous search text
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: 'search-bar-focus-target'
    timeout: 15000

# Search for the fixture property
- tapOn:
    id: 'search-bar-focus-target'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-bar-input'
- waitForAnimationToEnd

- inputText: 'Beeldbuisring 41 Eindhoven'
- pressKey: Back
- waitForAnimationToEnd

# Wait for the actual result row to appear
- extendedWaitUntil:
    visible:
      id: 'search-result-item'
    timeout: 15000

# Tap the matching search result — this triggers camera fly-to + preview card
- tapOn:
    id: 'search-result-item'
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for the preview card to settle after the search result selection.
- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 15000

# =====================================================================
# TEST 1: Preview card appears after search navigation
# =====================================================================

# Give the preview card time to render after camera animation
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/preview-card-visible.png

- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 10000

# =====================================================================
# TEST 2: Card body tap opens property details (bottom sheet)
# =====================================================================

- tapOn:
    id: 'group-preview-touch-overlay'
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'property-header-carousel'
    timeout: 5000
    optional: true

- tapOn:
    id: 'property-preview-address-container'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'property-preview-address'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'group-preview-touch-overlay'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'property-preview-card'
    optional: true
- waitForAnimationToEnd

# Wait for the bottom sheet to appear with property content
- extendedWaitUntil:
    visible:
      id: 'property-header-carousel'
    timeout: 15000
    optional: true

- takeScreenshot: test-results/visual-overhaul/preview-card/android/card-tap-bottom-sheet.png

# Verify bottom sheet shows the property address
- assertVisible:
    text: '.*Beeldbuisring.*'
    optional: true

# =====================================================================
# TEST 3: Dismiss bottom sheet to get back to preview card
# =====================================================================

# Dismiss the bottom sheet by swiping it down so the preview card becomes visible again
- swipe:
    start: '50%,30%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/after-dismiss-bottom-sheet.png

- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 10000

# Reset the property route before the preview-only checks below.
- tapOn:
    text: 'Go back'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'property-back-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'tab-index'
    optional: true
- waitForAnimationToEnd

# =====================================================================
# TEST 4: Quick action button (Like) — card stays visible
# =====================================================================

# Re-search the fixture property so Tests 4 and 5 run from a fresh preview card
- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 15000
- tapOn:
    id: 'search-bar-focus-target'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-clear-button'
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: 'search-bar-input'
    optional: true
- waitForAnimationToEnd

- inputText: 'Beeldbuisring 41 Eindhoven'
- extendedWaitUntil:
    visible:
      id: 'search-result-item'
    timeout: 15000
- tapOn:
    id: 'search-result-item'
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 15000
- waitForAnimationToEnd

- tapOn:
    id: 'group-preview-like-button'
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/after-like-tap.png

# Dismiss auth modal if it appeared (the "Close" text button IS accessible to Maestro)
- tapOn:
    text: 'Close'
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: 'property-preview-card'
    timeout: 10000

# =====================================================================
# TEST 5: Close button dismisses the card
# =====================================================================

- tapOn:
    id: 'group-preview-close-button'
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/card-closed.png

- assertNotVisible:
    id: 'property-preview-card'

# =====================================================================
# TEST 6: Cluster swipe pagination (enter a low-zoom camera route)
# =====================================================================
# Note: Clusters are unreliable due to queryRenderedFeatures bug on Android
# native (MapLibre issues #2875, #2828). All steps are optional.

# Native portrait intentionally hides zoom buttons, so use a canonical camera
# route instead of assuming those controls are present.
- openLink:
    link: 'huishype:///@51.4405702,5.4707418,13z'
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for tiles to reload at the low-zoom camera route
- extendedWaitUntil:
    visible:
      id: 'map-view'
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 10000

- assertVisible:
    id: 'map-filter-rail'
- assertVisible:
    id: 'location-button'

# Tap center of the map to try to hit a cluster node
- tapOn:
    point: '50%,50%'
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/cluster-for-swipe.png

# If cluster preview appeared, test swipe pagination
# Swipe left on the card to go to next property (should NOT pan the map)
- swipe:
    start: '70%,50%'
    end: '30%,50%'
    duration: 300
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/cluster-swiped.png

# Try tapping approximate position of right navigation arrow (optional)
- tapOn:
    point: '90%,50%'
    optional: true
- waitForAnimationToEnd

- takeScreenshot: test-results/visual-overhaul/preview-card/android/cluster-nav-arrow.png

# =====================================================================
# CLEANUP: Close any remaining preview and return to clean state
# =====================================================================

# Tap the close button to dismiss any preview card
- tapOn:
    id: 'group-preview-close-button'
    optional: true
- waitForAnimationToEnd

# Tap empty map area to dismiss anything else
- tapOn:
    point: '20%,40%'
    optional: true
- waitForAnimationToEnd

# Verify map is visible
- extendedWaitUntil:
    visible:
      id: 'search-bar-container'
    timeout: 10000

- assertVisible:
    id: 'map-filter-rail'
- assertVisible:
    id: 'location-button'
