appId: nl.huishype.app
---
# Density-aware grouping native verification flow
# Focused on the map surfaces changed by the sprint:
# 1. Map smoke / zoom controls
# 2. Search -> property preview
# 3. Property bottom-sheet expansion
# 4. Cluster preview at lower zoom

# Dismiss Expo developer menu onboarding popup if it appears
- tapOn:
    text: 'Continue'
    optional: true
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd

# Wait for the map to fully load
- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 180000

- runFlow: flows/01-smoke.yaml
- runFlow: flows/03-search-navigate.yaml
- runFlow: flows/04-bottom-sheet.yaml
- runFlow: flows/08-cluster-preview.yaml
