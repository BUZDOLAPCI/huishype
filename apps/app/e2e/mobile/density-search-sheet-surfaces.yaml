appId: nl.huishype.app
---
# Native verification for map smoke, search resolution, and property detail sheet.

- tapOn:
    text: 'Continue'
    optional: true
- waitForAnimationToEnd
- pressKey: back
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: 'Zoom.*'
    timeout: 180000

- runFlow: flows/01-smoke.yaml
- runFlow: flows/03-search-navigate.yaml
- runFlow: flows/04-bottom-sheet.yaml
