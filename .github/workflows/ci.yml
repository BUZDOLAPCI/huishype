name: CI

on:
  push:
    branches: ['**'] # Run on every commit to any branch
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=huishype \
            -e POSTGRES_PASSWORD=huishype_test \
            -e POSTGRES_DB=huishype_test \
            -p 5432:5432 \
            postgis/postgis:16-3.4
          for i in $(seq 1 30); do
            if docker exec postgres pg_isready -U huishype >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Run database migrations
        run: pnpm --filter @huishype/api db:migrate
        env:
          DATABASE_URL: postgresql://huishype:huishype_test@localhost:5432/huishype_test

      - name: Run canonical gate (lint, typecheck, unit, API integration, Playwright harness self-tests, Playwright integration)
        run: pnpm test
        env:
          DATABASE_URL: postgresql://huishype:huishype_test@localhost:5432/huishype_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          GOOGLE_CLIENT_ID: test-google-client-id
          APPLE_CLIENT_ID: test-apple-client-id
          COOKIE_SECRET: test-cookie-secret
          NODE_ENV: test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-artifacts
          if-no-files-found: ignore
          path: |
            test-results/**
            playwright-report/**
            coverage/**
