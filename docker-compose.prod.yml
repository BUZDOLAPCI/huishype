##
## HuisHype production stack — deploy via Coolify or `docker compose -f docker-compose.prod.yml up -d`
##
## Required env vars (set in Coolify UI or .env file):
##   DB_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, COOKIE_SECRET,
##   EXPO_PUBLIC_API_URL (build-time), GOOGLE_CLIENT_ID,
##   MAGIC_LINK_BASE_URL, RESEND_API_KEY, EMAIL_FROM, EMAIL_REPLY_TO,
##   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
##   R2_BUCKET, R2_PUBLIC_BASE_URL,
##   INGEST_API_KEY,
##   FUNDA_SOURCE_SERVICE_URL, FUNDA_SOURCE_SERVICE_API_KEY,
##   PARARIUS_SOURCE_SERVICE_URL, PARARIUS_SOURCE_SERVICE_API_KEY
##
## Optional env vars:
##   CORS_ORIGINS
##   EXPO_PUBLIC_GA4_MEASUREMENT_ID (build-time)
##   PROPERTY_TILE_PYRAMID_* resource controls and retention cadence
##

services:
  # ---------- Fastify API ----------
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-huishype}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-huishype}
      REDIS_URL: redis://redis:6379
      PORT: "3100"
      HOST: "0.0.0.0"
      RUN_MIGRATIONS: "true"
      RUN_LOCATION_SEARCH_AREA_REBUILD: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PHOTON_URL: http://photon:2322
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required for profile photo storage}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required for profile photo storage}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required for profile photo storage}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET is required for profile photo storage}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL is required for profile photo storage}
      PROFILE_PHOTO_MAX_SOURCE_BYTES: ${PROFILE_PHOTO_MAX_SOURCE_BYTES:-5242880}
      PROFILE_PHOTO_MAX_OUTPUT_BYTES: ${PROFILE_PHOTO_MAX_OUTPUT_BYTES:-1048576}
      PROPERTY_TILE_PYRAMID_LEASE_SECONDS: ${PROPERTY_TILE_PYRAMID_LEASE_SECONDS:-3600}
      PROPERTY_TILE_PYRAMID_STATEMENT_TIMEOUT_MS: ${PROPERTY_TILE_PYRAMID_STATEMENT_TIMEOUT_MS:-600000}
      PROPERTY_TILE_PYRAMID_MAX_HEAP_MB: ${PROPERTY_TILE_PYRAMID_MAX_HEAP_MB:-1024}
      PROPERTY_TILE_PYRAMID_MAX_MEMBER_ROWS: ${PROPERTY_TILE_PYRAMID_MAX_MEMBER_ROWS:-5000000}
      PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_CHUNK: ${PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_CHUNK:-1073741824}
      PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_BUILD: ${PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_BUILD:-10737418240}
      PROPERTY_TILE_PYRAMID_RETENTION_MAX_CHUNKS_PER_STEP: ${PROPERTY_TILE_PYRAMID_RETENTION_MAX_CHUNKS_PER_STEP:-25}
      INGEST_API_KEY: ${INGEST_API_KEY:?INGEST_API_KEY is required for production ingest callbacks}
      FUNDA_SOURCE_SERVICE_URL: ${FUNDA_SOURCE_SERVICE_URL:?FUNDA_SOURCE_SERVICE_URL is required for production listing source resolution}
      FUNDA_SOURCE_SERVICE_API_KEY: ${FUNDA_SOURCE_SERVICE_API_KEY:?FUNDA_SOURCE_SERVICE_API_KEY is required for production listing source resolution}
      PARARIUS_SOURCE_SERVICE_URL: ${PARARIUS_SOURCE_SERVICE_URL:?PARARIUS_SOURCE_SERVICE_URL is required for production listing source resolution}
      PARARIUS_SOURCE_SERVICE_API_KEY: ${PARARIUS_SOURCE_SERVICE_API_KEY:?PARARIUS_SOURCE_SERVICE_API_KEY is required for production listing source resolution}
    ports:
      - "3100:3100"
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID}
      traefik.http.services.api.loadbalancer.server.port: "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ---------- Background worker ----------
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-huishype}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-huishype}
      REDIS_URL: redis://redis:6379
      PORT: "3100"
      HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      PHOTON_URL: http://photon:2322
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAGIC_LINK_BASE_URL: ${MAGIC_LINK_BASE_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PROPERTY_TILE_PYRAMID_LEASE_SECONDS: ${PROPERTY_TILE_PYRAMID_LEASE_SECONDS:-3600}
      PROPERTY_TILE_PYRAMID_STATEMENT_TIMEOUT_MS: ${PROPERTY_TILE_PYRAMID_STATEMENT_TIMEOUT_MS:-600000}
      PROPERTY_TILE_PYRAMID_MAX_HEAP_MB: ${PROPERTY_TILE_PYRAMID_MAX_HEAP_MB:-1024}
      PROPERTY_TILE_PYRAMID_MAX_MEMBER_ROWS: ${PROPERTY_TILE_PYRAMID_MAX_MEMBER_ROWS:-5000000}
      PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_CHUNK: ${PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_CHUNK:-1073741824}
      PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_BUILD: ${PROPERTY_TILE_PYRAMID_MAX_WAL_BYTES_PER_BUILD:-10737418240}
      PROPERTY_TILE_PYRAMID_RETENTION_MAX_CHUNKS_PER_STEP: ${PROPERTY_TILE_PYRAMID_RETENTION_MAX_CHUNKS_PER_STEP:-25}
      INGEST_API_KEY: ${INGEST_API_KEY:?INGEST_API_KEY is required for production ingest callbacks}
      FUNDA_SOURCE_SERVICE_URL: ${FUNDA_SOURCE_SERVICE_URL:?FUNDA_SOURCE_SERVICE_URL is required for production listing source resolution}
      FUNDA_SOURCE_SERVICE_API_KEY: ${FUNDA_SOURCE_SERVICE_API_KEY:?FUNDA_SOURCE_SERVICE_API_KEY is required for production listing source resolution}
      PARARIUS_SOURCE_SERVICE_URL: ${PARARIUS_SOURCE_SERVICE_URL:?PARARIUS_SOURCE_SERVICE_URL is required for production listing source resolution}
      PARARIUS_SOURCE_SERVICE_API_KEY: ${PARARIUS_SOURCE_SERVICE_API_KEY:?PARARIUS_SOURCE_SERVICE_API_KEY is required for production listing source resolution}
      WORKER_INGEST_CONCURRENCY: ${WORKER_INGEST_CONCURRENCY:-4}
      WORKER_MAINTENANCE_CONCURRENCY: ${WORKER_MAINTENANCE_CONCURRENCY:-1}
      WORKER_RECOVERY_BATCH_LIMIT: ${WORKER_RECOVERY_BATCH_LIMIT:-100}
      WORKER_RECOVERY_SWEEP_INTERVAL_MS: ${WORKER_RECOVERY_SWEEP_INTERVAL_MS:-30000}
      WORKER_HEALTH_LOG_INTERVAL_MS: ${WORKER_HEALTH_LOG_INTERVAL_MS:-60000}
      WORKER_STALE_PROCESSING_AFTER_MS: ${WORKER_STALE_PROCESSING_AFTER_MS:-600000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-15000}
      WORKER_PROPERTY_TILE_PYRAMID_RETENTION_UTC_MINUTE_OF_DAY: ${WORKER_PROPERTY_TILE_PYRAMID_RETENTION_UTC_MINUTE_OF_DAY:-200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ---------- Web (Expo static export + nginx) ----------
  web:
    build:
      context: .
      dockerfile: apps/app/Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
        EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        EXPO_PUBLIC_GA4_MEASUREMENT_ID: ${EXPO_PUBLIC_GA4_MEASUREMENT_ID:-}
    restart: unless-stopped
    ports:
      - "3000:80"
    labels:
      traefik.docker.network: ${COOLIFY_RESOURCE_UUID}
      traefik.http.services.web.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - api
    networks:
      - internal

  # ---------- PostgreSQL + PostGIS ----------
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${DB_USER:-huishype}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-huishype}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-huishype} -d ${DB_NAME:-huishype}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  # ---------- Photon geocoder (Europe-scoped address search) ----------
  photon:
    build:
      context: .
      dockerfile_inline: |
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /photon
        ADD https://github.com/komoot/photon/releases/download/1.1.0/photon-1.1.0.jar photon.jar
        EXPOSE 2322
        ENTRYPOINT ["java"]
        CMD ["-Xmx4G", "-jar", "photon.jar", "serve", "-listen-ip", "0.0.0.0", "-listen-port", "2322", "-data-dir", "/photon/data"]
    restart: unless-stopped
    volumes:
      - photon_data:/photon/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2322/api?q=test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  photon_data:

networks:
  internal:
    driver: bridge
