services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: huishype-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: huishype
      POSTGRES_PASSWORD: huishype_dev
      POSTGRES_DB: huishype
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huishype -d huishype"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: huishype-redis
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: huishype-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://huishype:huishype_dev@postgres:5432/huishype
      REDIS_URL: redis://redis:6379
      PORT: "3100"
      HOST: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Photon geocoder (Komoot) — self-hosted, Europe-scoped address search.
  # There is no official Docker image. This builds from a Dockerfile that
  # downloads the Photon JAR from GitHub releases.
  #
  # First run: download a pre-built Europe database extract into the photon_data volume:
  #   mkdir -p photon_data && cd photon_data
  #   wget -O - https://download1.graphhopper.com/public/europe/photon-db-europe-1.0-latest.tar.bz2 | pbzip2 -cd | tar x
  # Or for NL only (smaller):
  #   wget -O - https://download1.graphhopper.com/public/photon-db-nl-1.0-latest.tar.bz2 | pbzip2 -cd | tar x
  #
  # Then start: docker compose up -d photon
  photon:
    build:
      context: .
      dockerfile_inline: |
        FROM eclipse-temurin:21-jre-alpine
        WORKDIR /photon
        ADD https://github.com/komoot/photon/releases/download/1.1.0/photon-1.1.0.jar photon.jar
        EXPOSE 2322
        ENTRYPOINT ["java"]
        CMD ["-Xmx4G", "-jar", "photon.jar", "serve", "-listen-ip", "0.0.0.0", "-listen-port", "2322", "-data-dir", "/photon/data"]
    container_name: huishype-photon
    ports:
      - "2322:2322"
    volumes:
      - ./photon_data:/photon/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
